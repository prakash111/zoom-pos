name: zoom_pos_mobile
description: "Sales and Inventory client — Android and Windows desktop app for the multi-tenant SaaS platform."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  # sqflite (Android/iOS only). Two different sqflite_common_ffi/sqlite3
  # version combinations both hit an identical Flutter-Windows kernel
  # compiler bug ("cannot find sqflite_common_ffi's own package file")
  # regardless of whether sqlite3's native-assets build_hooks path was
  # involved, so desktop (Windows/Linux) uses a plain JSON-file store
  # instead — see lib/core/storage/app_database.dart.
  sqflite: ^2.4.1
  path_provider: ^2.1.5

  # Windows desktop window lifecycle (title bar, close-intercept for
  # session auto-logout). No-op on Android — guarded at the call site.
  window_manager: ^0.4.3
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Utilities
  # Pinned by flutter_localizations (SDK) — Flutter's bundled localizations
  # package requires this exact intl major/minor to resolve.
  intl: ^0.20.3
  timezone: ^0.10.0
  uuid: ^4.5.1
  collection: ^1.18.0
  fl_chart: ^0.69.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  share_plus: ^10.1.2
  flutter_widget_from_html: ^0.15.2

  # Invoice / receipt PDF + printing
  printing: ^5.13.4
  pdf: ^3.11.1

  # Product/logo images, bulk-import file picking, barcode/QR scanning
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  mobile_scanner: ^5.2.3

  # QR code generation (table "QR Stand" preview/share in Restaurant Mode)
  qr_flutter: ^4.1.0

  # Platform-wide push delivery and Android max-importance alarm channels.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^20.1.0

  # Thermal receipt printing (Android/iOS only — never imported from
  # web/desktop code paths, see lib/core/services/thermal/)
  print_bluetooth_thermal: ^1.1.4
  esc_pos_utils_plus: ^2.0.4

  # Subscription purchase: Razorpay hosted checkout SDK, and a WebView for
  # Mercado Pago's hosted-redirect checkout
  razorpay_flutter: ^1.3.7
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/launcher.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/launcher.png"
  min_sdk_android: 21
  remove_alpha_ios: false
  windows:
    generate: true
    image_path: "assets/icon/launcher.png"
    icon_size: 256
