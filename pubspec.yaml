name: zoom_pos_mobile
description: "Zoom POS mobile client — Android app for the Zoom POS multi-tenant SaaS platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  fl_chart: ^0.69.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/launcher.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/launcher.png"
  min_sdk_android: 21
  remove_alpha_ios: false
