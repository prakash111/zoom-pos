name: zoom_pos_mobile
description: "Sales & Inventory mobile client — Android app for the multi-tenant SaaS platform."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  fl_chart: ^0.69.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  share_plus: ^10.1.2
  flutter_widget_from_html: ^0.15.2

  # Invoice / receipt PDF + printing
  printing: ^5.13.4
  pdf: ^3.11.1

  # Product/logo images, bulk-import file picking, barcode/QR scanning
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  mobile_scanner: ^5.2.3

  # Thermal receipt printing (Android/iOS only — never imported from
  # web/desktop code paths, see lib/core/services/thermal/)
  print_bluetooth_thermal: ^1.1.4
  esc_pos_utils_plus: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/launcher.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/launcher.png"
  min_sdk_android: 21
  remove_alpha_ios: false
