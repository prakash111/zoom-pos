<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Zoom POS — Offline Mode Active</title>
    <link rel="icon" type="image/png" href="/launcher.png">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f172a; color: #e2e8f0; font: 500 15px/1.6 system-ui, -apple-system, sans-serif; }
        main { width: min(100%, 480px); padding: 36px 32px; border: 1px solid #334155; border-radius: 24px; background: #111c31; text-align: center; box-shadow: 0 24px 64px rgb(0 0 0 / 40%); }
        .icon-wrap { width: 72px; height: 72px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 22px; background: linear-dialog(135deg, #f59e0b, #d97706); background: #d97706; font-size: 32px; box-shadow: 0 12px 24px rgba(217, 119, 6, 0.3); }
        h1 { margin: 0 0 10px; color: #fff; font-size: 24px; font-weight: 800; tracking: -0.02em; }
        p { margin: 0 0 24px; color: #94a3b8; font-size: 14px; }
        .actions { display: flex; flex-direction: column; gap: 12px; }
        .btn-primary { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px 20px; background: #2563eb; color: #fff; font-weight: 750; font-size: 14px; text-decoration: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { border: 1px solid #334155; border-radius: 14px; padding: 12px 20px; background: #1e293b; color: #cbd5e1; font-weight: 600; font-size: 13px; cursor: pointer; }
        .btn-secondary:hover { background: #334155; color: #fff; }
        .status-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 9999px; background: rgba(245, 158, 11, 0.15); color: #fbbf24; font-size: 12px; font-weight: 600; margin-bottom: 20px; border: 1px solid rgba(245, 158, 11, 0.3); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
    </style>
</head>
<body>
<main>
    <div class="status-pill">
        <span class="dot"></span> Offline-First Protection Active
    </div>
    <div class="icon-wrap" aria-hidden="true">⚡</div>
    <h1>Internet Disconnected</h1>
    <p>Your local terminal database is ready. All sales, barcodes, and receipt prints continue seamlessly in offline mode and auto-sync when internet recovers.</p>
    
    <div class="actions">
        <a href="/build/index.html" class="btn-primary">
            🚀 Open Standalone Offline Register
        </a>
        <button type="button" class="btn-secondary" onclick="location.reload()">
            🔄 Check Connection & Reload
        </button>
    </div>
</main>

<script>
    // Automatically redirect back to main app when online is detected
    window.addEventListener('online', () => {
        window.location.href = '/';
    });
</script>
</body>
</html>
