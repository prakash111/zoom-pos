sans-serif" font-size="15">Client requests app/bootstrap</text><text x="814" y="285" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Receive modes, menus and flags</text><text x="814" y="313" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Receive schemas, theme and strings</text><rect x="42" y="371" width="354" height="167" rx="15" fill="#13253c" stroke="#3b536f"/><circle cx="72" cy="403" r="16" fill="#234a57"/><text x="62" y="408" fill="#82f0d5" font-family="Arial,sans-serif" font-size="13" font-weight="700">04</text><text x="100" y="409" fill="#f8fafc" font-family="Arial,sans-serif" font-size="16" font-weight="700">RESOLVE</text><text x="62" y="447" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Use a native screen if registered</text><text x="62" y="475" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Otherwise resolve endpoint/module</text><text x="62" y="503" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Render supported schema components</text><path d="M399 453h15m-5-5 5 5-5 5" fill="none" stroke="#58cbb5" stroke-width="2"/><rect x="418" y="371" width="354" height="167" rx="15" fill="#13253c" stroke="#3b536f"/><circle cx="448" cy="403" r="16" fill="#234a57"/><text x="438" y="408" fill="#82f0d5" font-family="Arial,sans-serif" font-size="13" font-weight="700">05</text><text x="476" y="409" fill="#f8fafc" font-family="Arial,sans-serif" font-size="16" font-weight="700">WORKFLOW</text><text x="438" y="447" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Capture customer or work item</text><text x="438" y="475" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Perform permitted business actions</text><text x="438" y="503" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Save under company + store context</text><path d="M775 453h15m-5-5 5 5-5 5" fill="none" stroke="#58cbb5" stroke-width="2"/><rect x="794" y="371" width="354" height="167" rx="15" fill="#13253c" stroke="#3b536f"/><circle cx="824" cy="403" r="16" fill="#234a57"/><text x="814" y="408" fill="#82f0d5" font-family="Arial,sans-serif" font-size="13" font-weight="700">06</text><text x="852" y="409" fill="#f8fafc" font-family="Arial,sans-serif" font-size="16" font-weight="700">REFRESH</text><text x="814" y="447" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Switch mode or refresh bootstrap</text><text x="814" y="475" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Check the target client build</text><text x="814" y="503" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Test new components and actions</text><text x="42" y="591" fill="#bdcadb" font-family="Arial,sans-serif" font-size="13">Read the matching chapter for permissions, setup steps and release-specific limits.</text></svg>