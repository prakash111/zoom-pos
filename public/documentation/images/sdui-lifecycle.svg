<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 615" role="img" aria-labelledby="title desc">
<title id="title">From module entitlement to a working screen</title><desc id="desc">A menu update can use existing client capabilities; native additions need a release. Obtain and install the module; Activate platform module; Client requests app/bootstrap; Use a native screen if registered; Capture customer or work item; Switch mode or refresh bootstrap</desc>
