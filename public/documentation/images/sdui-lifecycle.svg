<text x="42" y="108" fill="#f8fafc" font-family="Arial,sans-serif" font-size="32" font-weight="700">From module entitlement to a working screen</text>
<text x="42" y="143" fill="#bdcadb" font-family="Arial,sans-serif" font-size="16">A menu update can use existing client capabilities; native additions need a release</text>
