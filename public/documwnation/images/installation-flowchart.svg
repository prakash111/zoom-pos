<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 615" role="img" aria-labelledby="title desc">
<title id="title">Installation to the first verified sale</title><desc id="desc">Follow this sequence on a new host; preserve keys and data during upgrades. Choose host + database; Create .env for a new install; Install locked Composer packages; Open /install; Create plan and tenant; Start cron + required queue workers</desc>
