amily="Arial,sans-serif" font-size="15">Install locked Composer packages</text><text x="814" y="285" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Generate key only for new install</text><text x="814" y="313" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Build Vite assets + storage link</text><rect x="42" y="371" width="354" height="167" rx="15" fill="#13253c" stroke="#3b536f"/><circle cx="72" cy="403" r="16" fill="#234a57"/><text x="62" y="408" fill="#82f0d5" font-family="Arial,sans-serif" font-size="13" font-weight="700">04</text><text x="100" y="409" fill="#f8fafc" font-family="Arial,sans-serif" font-size="16" font-weight="700">INSTALL</text><text x="62" y="447" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Open /install</text><text x="62" y="475" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Complete migration + admin steps</text><text x="62" y="503" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Verify core license + finalize</text><path d="M399 453h15m-5-5 5 5-5 5" fill="none" stroke="#58cbb5" stroke-width="2"/><rect x="418" y="371" width="354" height="167" rx="15" fill="#13253c" stroke="#3b536f"/><circle cx="448" cy="403" r="16" fill="#234a57"/><text x="438" y="408" fill="#82f0d5" font-family="Arial,sans-serif" font-size="13" font-weight="700">05</text><text x="476" y="409" fill="#f8fafc" font-family="Arial,sans-serif" font-size="16" font-weight="700">PROVISION</text><text x="438" y="447" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Create plan and tenant</text><text x="438" y="475" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Enable modules + assign staff</text><text x="438" y="503" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Set branch, tax and payment details</text><path d="M775 453h15m-5-5 5 5-5 5" fill="none" stroke="#58cbb5" stroke-width="2"/><rect x="794" y="371" width="354" height="167" rx="15" fill="#13253c" stroke="#3b536f"/><circle cx="824" cy="403" r="16" fill="#234a57"/><text x="814" y="408" fill="#82f0d5" font-family="Arial,sans-serif" font-size="13" font-weight="700">06</text><text x="852" y="409" fill="#f8fafc" font-family="Arial,sans-serif" font-size="16" font-weight="700">OPERATE</text><text x="814" y="447" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Start cron + required queue workers</text><text x="814" y="475" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Test sale, stock and document</text><text x="814" y="503" fill="#d5dfeb" font-family="Arial,sans-serif" font-size="15">Validate client + recovery procedure</text><text x="42" y="591" fill="#bdcadb" font-family="Arial,sans-serif" font-size="13">Read the matching chapter for permissions, setup steps and release-specific limits.</text></svg>