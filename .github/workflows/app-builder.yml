name: App Builder CI/CD Engine
run-name: App Builder ${{ inputs.platform }} - ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique Build Request ID'
        required: true
        type: string
      platform:
        description: 'Target compilation platform (android, web, windows, ios)'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - web
          - windows
          - ios
      app_name:
        description: 'Application Display Name'
        required: false
        default: 'Zoom Sales POS'
        type: string
      short_name:
        description: 'Short Application Name / Executable Slug'
        required: false
        default: 'ZoomPOS'
        type: string
      package_id:
        description: 'Package / Bundle Identifier (e.g. com.company.pos)'
        required: false
        default: 'com.zoomnearby.zoompos'
        type: string
      server_url:
        description: 'Backend API Server URL (e.g. https://saas.zoomnearby.com)'
        required: false
        default: 'https://saas.zoomnearby.com'
        type: string
      primary_color:
        description: 'Primary Theme Color Hex (e.g. #4F46E5)'
        required: false
        default: '#4F46E5'
        type: string
      branding_bundle_url:
        description: 'URL to download the generated icons and white-label branding bundle'
        required: false
        default: ''
        type: string
      branding_json:
        description: 'Raw JSON containing complete branding configuration'
        required: false
        default: ''
        type: string
      custom_logo_base64:
        description: 'Base64 encoded custom logo PNG'
        required: false
        default: ''
        type: string
      custom_source_url:
        description: 'Download URL for custom uploaded source ZIP'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  # ============================================================================
  # ANDROID BUILD JOB
  # ============================================================================
  build-android:
    name: Build Android (${{ inputs.build_id }})
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Custom Source ZIP (if provided)
        if: ${{ inputs.custom_source_url != '' }}
        run: |
          echo "Applying custom uploaded source package from ${{ inputs.custom_source_url }}..."
          curl -f -L -s -S "${{ inputs.custom_source_url }}" -o custom_source.zip
          unzip -o -q custom_source.zip -d .
          rm -f custom_source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Flutter (stable, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract app version
        id: version
        run: |
          APP_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          BUILD_NUMBER=$(grep -m1 '^version:' pubspec.yaml | sed -nE 's/.*\+([0-9]+).*/\1/p')
          echo "APP_VERSION=${APP_VERSION:-1.0.5}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_NUMBER:-1}" >> $GITHUB_ENV

      - name: Set up Android Keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || '123456789' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || '123456789' }}
          ALIAS: ${{ inputs.short_name || 'app' }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/app-release-key.jks"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=${{ inputs.app_name }}, OU=Production, O=${{ inputs.app_name }}, C=US"
          fi
          cat <<KEYPROP > android/key.properties
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$ALIAS
          storeFile=$KEYSTORE_PATH
          KEYPROP

      - name: Apply Complete White-Label Branding
        run: |
          echo "Starting complete White-Label Branding System for ${{ inputs.build_id }}..."
          mkdir -p branding_workspace

          # 1. Fetch Branding Assets Bundle if provided
          if [ -n "${{ inputs.branding_bundle_url }}" ]; then
            echo "Fetching branding assets bundle from ${{ inputs.branding_bundle_url }}..."
            curl -f -L -s -S "${{ inputs.branding_bundle_url }}" -o branding_workspace/bundle.zip || true
            if [ -s "branding_workspace/bundle.zip" ]; then
              unzip -o -q branding_workspace/bundle.zip -d branding_workspace/
            fi
          fi

          # 2. Prepare Config JSON
          if [ ! -f "branding_workspace/branding_config.json" ]; then
            if [ -n "${{ inputs.branding_json }}" ]; then
              echo '${{ inputs.branding_json }}' > branding_workspace/branding_config.json
            else
              cat <<EOF > branding_workspace/branding_config.json
              {
                "app_name": "${{ inputs.app_name }}",
                "short_name": "${{ inputs.short_name }}",
                "display_name": "${{ inputs.app_name }}",
                "package_id": "${{ inputs.package_id }}",
                "server_url": "${{ inputs.server_url }}",
                "primary_color": "${{ inputs.primary_color }}"
              }
          EOF
            fi
          fi

          # 3. Ensure whitelabel.py script exists
          if [ ! -f "scripts/whitelabel.py" ]; then
            mkdir -p scripts
            curl -f -L -s -S "https://saas.zoomnearby.com/app-builder/scripts/whitelabel.py" -o scripts/whitelabel.py || true
          fi

          # 4. Execute White-Label Engine
          if [ -f "scripts/whitelabel.py" ]; then
            python3 scripts/whitelabel.py . branding_workspace/branding_config.json branding_workspace/assets
          else
            echo "Fallback white-label replacement..."
            sed -i 's/applicationId = "[^"]*"/applicationId = "${{ inputs.package_id }}"/g' android/app/build.gradle.kts || true
            sed -i 's/namespace = "[^"]*"/namespace = "${{ inputs.package_id }}"/g' android/app/build.gradle.kts || true
            sed -i 's/android:label="[^"]*"/android:label="${{ inputs.app_name }}"/g' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed Android release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android App Bundle (AAB)
        continue-on-error: true
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Prepare White-Labeled Artifacts
        run: |
          BRAND_SLUG="${{ inputs.short_name || 'App' }}"
          mkdir -p builder-output
          
          # Rename output APK to brand name
          cp build/app/outputs/flutter-apk/app-release.apk "builder-output/${BRAND_SLUG}-v${{ env.APP_VERSION }}-android.apk"
          
          # Rename AAB if created
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp build/app/outputs/bundle/release/app-release.aab "builder-output/${BRAND_SLUG}-v${{ env.APP_VERSION }}-android.aab"
          fi
          
          # Bundle for user download
          cd builder-output
          zip -r "app-builder-${{ inputs.build_id }}-android.zip" *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-builder-${{ inputs.build_id }}-android
          path: builder-output/app-builder-${{ inputs.build_id }}-android.zip
          retention-days: 7

  # ============================================================================
  # WEB BUILD JOB
  # ============================================================================
  build-web:
    name: Build Web (${{ inputs.build_id }})
    if: inputs.platform == 'web'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Custom Source ZIP (if provided)
        if: ${{ inputs.custom_source_url != '' }}
        run: |
          echo "Applying custom uploaded source package from ${{ inputs.custom_source_url }}..."
          curl -f -L -s -S "${{ inputs.custom_source_url }}" -o custom_source.zip
          unzip -o -q custom_source.zip -d .
          rm -f custom_source.zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Flutter (stable, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Web platform scaffold exists
        run: |
          flutter config --enable-web
          flutter create --platforms=web .

      - name: Apply Complete White-Label Branding
        run: |
          echo "Starting complete White-Label Branding System for Web ${{ inputs.build_id }}..."
          mkdir -p branding_workspace

          if [ -n "${{ inputs.branding_bundle_url }}" ]; then
            curl -f -L -s -S "${{ inputs.branding_bundle_url }}" -o branding_workspace/bundle.zip || true
            if [ -s "branding_workspace/bundle.zip" ]; then
              unzip -o -q branding_workspace/bundle.zip -d branding_workspace/
            fi
          fi

          if [ ! -f "branding_workspace/branding_config.json" ]; then
            if [ -n "${{ inputs.branding_json }}" ]; then
              echo '${{ inputs.branding_json }}' > branding_workspace/branding_config.json
            else
              cat <<EOF > branding_workspace/branding_config.json
              {
                "app_name": "${{ inputs.app_name }}",
                "short_name": "${{ inputs.short_name }}",
                "display_name": "${{ inputs.app_name }}",
                "package_id": "${{ inputs.package_id }}",
                "server_url": "${{ inputs.server_url }}",
                "primary_color": "${{ inputs.primary_color }}"
              }
          EOF
            fi
          fi

          if [ ! -f "scripts/whitelabel.py" ]; then
            mkdir -p scripts
            curl -f -L -s -S "https://saas.zoomnearby.com/app-builder/scripts/whitelabel.py" -o scripts/whitelabel.py || true
          fi

          if [ -f "scripts/whitelabel.py" ]; then
            python3 scripts/whitelabel.py . branding_workspace/branding_config.json branding_workspace/assets
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter Web release
        run: flutter build web --release --base-href "/"

      - name: Prepare White-Labeled Web Artifact
        run: |
          BRAND_SLUG="${{ inputs.short_name || 'App' }}"
          mkdir -p builder-output
          cd build/web
          zip -r "../../builder-output/${BRAND_SLUG}-web.zip" .
          cp "../../builder-output/${BRAND_SLUG}-web.zip" "../../builder-output/app-builder-${{ inputs.build_id }}-web.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-builder-${{ inputs.build_id }}-web
          path: builder-output/app-builder-${{ inputs.build_id }}-web.zip
          retention-days: 7

  # ============================================================================
  # WINDOWS BUILD JOB
  # ============================================================================
  build-windows:
    name: Build Windows (${{ inputs.build_id }})
    if: inputs.platform == 'windows'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Custom Source ZIP (if provided)
        if: ${{ inputs.custom_source_url != '' }}
        shell: pwsh
        run: |
          Write-Host "Applying custom uploaded source package from ${{ inputs.custom_source_url }}..."
          Invoke-WebRequest -Uri "${{ inputs.custom_source_url }}" -OutFile "custom_source.zip"
          Expand-Archive -Path "custom_source.zip" -DestinationPath . -Force
          Remove-Item -Force "custom_source.zip"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Flutter (stable, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Windows platform scaffold exists
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            flutter config --enable-windows-desktop
            flutter create --platforms=windows .
          }

      - name: Apply Complete White-Label Branding
        shell: pwsh
        run: |
          Write-Host "Starting complete White-Label Branding System for Windows ${{ inputs.build_id }}..."
          New-Item -ItemType Directory -Force -Path branding_workspace

          if ("${{ inputs.branding_bundle_url }}") {
            try {
              Invoke-WebRequest -Uri "${{ inputs.branding_bundle_url }}" -OutFile "branding_workspace/bundle.zip"
              Expand-Archive -Path "branding_workspace/bundle.zip" -DestinationPath "branding_workspace" -Force
            } catch {
              Write-Host "Could not download bundle. Continuing with parameters..."
            }
          }

          if (-not (Test-Path "branding_workspace/branding_config.json")) {
            if ("${{ inputs.branding_json }}") {
              Set-Content -Path "branding_workspace/branding_config.json" -Value '${{ inputs.branding_json }}'
            } else {
              $defaultJson = @{
                app_name = "${{ inputs.app_name }}"
                short_name = "${{ inputs.short_name }}"
                display_name = "${{ inputs.app_name }}"
                package_id = "${{ inputs.package_id }}"
                server_url = "${{ inputs.server_url }}"
                primary_color = "${{ inputs.primary_color }}"
              } | ConvertTo-Json
              Set-Content -Path "branding_workspace/branding_config.json" -Value $defaultJson
            }
          }

          if (-not (Test-Path "scripts/whitelabel.py")) {
            New-Item -ItemType Directory -Force -Path scripts
            Invoke-WebRequest -Uri "https://saas.zoomnearby.com/app-builder/scripts/whitelabel.py" -OutFile "scripts/whitelabel.py"
          }

          if (Test-Path "scripts/whitelabel.py") {
            python scripts/whitelabel.py . branding_workspace/branding_config.json branding_workspace/assets
          }

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package White-Labeled Windows Artifact
        shell: pwsh
        run: |
          $brand = "${{ inputs.short_name }}"
          if (-not $brand) { $brand = "App" }
          New-Item -ItemType Directory -Force -Path builder-output
          
          # Find output directory
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = (Get-ChildItem -Path "build\windows" -Recurse -Directory -Filter "Release" | Select-Object -First 1).FullName
          }
          
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "builder-output\$brand-windows.zip" -Force
          Copy-Item "builder-output\$brand-windows.zip" "builder-output\app-builder-${{ inputs.build_id }}-windows.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-builder-${{ inputs.build_id }}-windows
          path: builder-output/app-builder-${{ inputs.build_id }}-windows.zip
          retention-days: 7

  # ============================================================================
  # IOS BUILD JOB
  # ============================================================================
  build-ios:
    name: Build iOS (${{ inputs.build_id }})
    if: inputs.platform == 'ios'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Custom Source ZIP (if provided)
        if: ${{ inputs.custom_source_url != '' }}
        run: |
          echo "Applying custom uploaded source package from ${{ inputs.custom_source_url }}..."
          curl -f -L -s -S "${{ inputs.custom_source_url }}" -o custom_source.zip
          unzip -o -q custom_source.zip -d .
          rm -f custom_source.zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Flutter (stable, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Apply Complete White-Label Branding
        run: |
          echo "Starting complete White-Label Branding System for iOS ${{ inputs.build_id }}..."
          mkdir -p branding_workspace

          if [ -n "${{ inputs.branding_bundle_url }}" ]; then
            curl -f -L -s -S "${{ inputs.branding_bundle_url }}" -o branding_workspace/bundle.zip || true
            if [ -s "branding_workspace/bundle.zip" ]; then
              unzip -o -q branding_workspace/bundle.zip -d branding_workspace/
            fi
          fi

          if [ ! -f "branding_workspace/branding_config.json" ]; then
            if [ -n "${{ inputs.branding_json }}" ]; then
              echo '${{ inputs.branding_json }}' > branding_workspace/branding_config.json
            else
              cat <<EOF > branding_workspace/branding_config.json
              {
                "app_name": "${{ inputs.app_name }}",
                "short_name": "${{ inputs.short_name }}",
                "display_name": "${{ inputs.app_name }}",
                "package_id": "${{ inputs.package_id }}",
                "server_url": "${{ inputs.server_url }}",
                "primary_color": "${{ inputs.primary_color }}"
              }
          EOF
            fi
          fi

          if [ ! -f "scripts/whitelabel.py" ]; then
            mkdir -p scripts
            curl -f -L -s -S "https://saas.zoomnearby.com/app-builder/scripts/whitelabel.py" -o scripts/whitelabel.py || true
          fi

          if [ -f "scripts/whitelabel.py" ]; then
            python3 scripts/whitelabel.py . branding_workspace/branding_config.json branding_workspace/assets
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS release bundle (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package White-Labeled iOS Artifact
        run: |
          BRAND_SLUG="${{ inputs.short_name || 'App' }}"
          mkdir -p builder-output
          cd build/ios/iphoneos
          zip -r "../../../builder-output/${BRAND_SLUG}-ios.ipa" Runner.app
          zip -r "../../../builder-output/app-builder-${{ inputs.build_id }}-ios.zip" Runner.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-builder-${{ inputs.build_id }}-ios
          path: builder-output/app-builder-${{ inputs.build_id }}-ios.zip
          retention-days: 7
