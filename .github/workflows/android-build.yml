name: Android Build

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - feat/windows-offline-sync
    tags:
      - "v*.*.*"
      - "mobile-v*"
  pull_request:
    branches:
      - main
      - feat/windows-offline-sync

permissions:
  contents: write # needed to attach the APK/AAB to a GitHub Release

jobs:
  build-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter (stable, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract app version from pubspec.yaml
        id: version
        run: |
          APP_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          BUILD_NUMBER=$(grep -m1 '^version:' pubspec.yaml | sed -nE 's/.*\+([0-9]+).*/\1/p')
          if [ -z "$APP_VERSION" ]; then
            echo "Could not determine app version from pubspec.yaml"
            exit 1
          fi
          echo "App version: $APP_VERSION (build: $BUILD_NUMBER)"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Set up Android Keystore & Signing Configuration
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || '123456789' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || '123456789' }}
          ALIAS: ${{ secrets.KEY_ALIAS || 'zoom-pos' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/zoom-pos.jks"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from KEYSTORE_BASE64 secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Restoring the repository signing keystore..."
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/zoom-pos.jks" \
              -o "$KEYSTORE_PATH" || true
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "No signing keystore available; generating an ephemeral CI keystore."
            rm -f "$KEYSTORE_PATH"
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=ZoomNearby CI, OU=Build, O=ZoomNearby, C=IN"
          fi

          cat <<KEYPROP > android/key.properties
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$ALIAS
          storeFile=$KEYSTORE_PATH
          KEYPROP

          echo "Signing config created in android/key.properties:"
          echo "storeFile=$KEYSTORE_PATH"
          echo "keyAlias=$ALIAS"

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Run Flutter tests
        run: flutter test

      - name: Build signed Android release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/zoom-pos.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '123456789' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'zoom-pos' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '123456789' }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build signed Android release App Bundle (AAB)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/zoom-pos.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '123456789' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'zoom-pos' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '123456789' }}
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Prepare release artifacts
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/zoom-pos-v${{ env.APP_VERSION }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/zoom-pos-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release-output/zoom-pos-v${{ env.APP_VERSION }}.aab
          cp build/app/outputs/bundle/release/app-release.aab release-output/zoom-pos-release.aab

      - name: Upload APK artifact (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZoomPOS-Android-APK-v${{ env.APP_VERSION }}
          path: |
            release-output/zoom-pos-v${{ env.APP_VERSION }}.apk
            release-output/zoom-pos-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 5

      - name: Upload App Bundle artifact (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZoomPOS-Android-Bundle-v${{ env.APP_VERSION }}
          path: |
            release-output/zoom-pos-v${{ env.APP_VERSION }}.aab
            release-output/zoom-pos-release.aab
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 5

      # Publish the APK + AAB as GitHub Release assets — Release storage is
      # separate from (and far larger than) the Actions artifact quota, so
      # this is the primary distribution path. Tag pushes use their own tag;
      # manual / branch runs get a rolling per-run pre-release tag.
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-output/zoom-pos-v${{ env.APP_VERSION }}.apk
            release-output/zoom-pos-v${{ env.APP_VERSION }}.aab
          fail_on_unmatched_files: true
          tag_name: >-
            ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name
            || format('android-build-{0}', github.run_number) }}
          name: >-
            ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name
            || format('Android Build {0} (build {1})', env.APP_VERSION, github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          body: >-
            Android APK + AAB built from
            `${{ github.ref_name }}` @ ${{ github.sha }}.
