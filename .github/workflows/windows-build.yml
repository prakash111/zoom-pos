name: Windows Build

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "mobile-v*"

permissions:
  contents: write # needed to attach the installer to a GitHub Release

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (stable, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Windows platform scaffold exists
        # windows/ is committed to the repo. This is a safety net only, in
        # case it's ever removed — flutter build below regenerates the
        # plugin registrant/cmake files regardless.
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            flutter config --enable-windows-desktop
            flutter create --platforms=windows .
          } else {
            Write-Host "windows/ already present, skipping scaffold."
          }

      - name: Flutter pub get
        run: flutter pub get

      - name: Extract app version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch 'version:\s*(\d+\.\d+\.\d+)(\+(\d+))?') {
            throw "Could not find a version: line in pubspec.yaml"
          }
          $appVersion = $Matches[1]
          $buildNumber = $Matches[3]
          Write-Host "App version: $appVersion (build $buildNumber)"
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "APP_VERSION=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows release
        # --verbose is required here: `flutter build windows` normally
        # swallows the real cmake_install.cmake error and only prints the
        # generic MSB3073 wrapper (flutter/flutter#154977). With -v the
        # underlying CMake/MSBuild error (e.g. a plugin's bundled-library
        # path being wrong, flutter/flutter#143589) is printed to the log.
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: flutter build windows --release --verbose

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ env.APP_VERSION }} `
            installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalesAndInventory-Windows-Installer-${{ env.APP_VERSION }}
          path: Output/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          generate_release_notes: true
