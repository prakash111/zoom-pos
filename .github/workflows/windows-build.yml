name: Windows Build

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to attach the installer to a GitHub Release

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pin PUB_CACHE to the workspace drive
        # windows-latest keeps the OS/user profile on C: but checks out the
        # workspace on D:. PUB_CACHE defaults under C:\Users\runneradmin\...,
        # and packages resolved from a cache on a different drive than the
        # project have been reported to end up referenced in
        # .dart_tool/package_config.json without their files actually being
        # reachable at build time (subosito/flutter-action#143). Force the
        # cache onto the same drive as the workspace to rule that out.
        # (The `runner` context isn't allowed in a job-level `env:` block,
        # so this is set via $GITHUB_ENV from the RUNNER_TEMP env var
        # instead, which every step already has.)
        shell: pwsh
        run: |
          "PUB_CACHE=$env:RUNNER_TEMP\pub-cache" >> $env:GITHUB_ENV

      - name: Setup Flutter (stable, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Windows platform scaffold exists
        # This repo doesn't have windows/ committed yet (no local Windows
        # dev machine to generate it from). Scaffold it here so the build
        # below has something to compile. Once you do run `flutter create
        # --platforms=windows .` locally and commit windows/, this step
        # becomes a no-op and can eventually be deleted. Runs before the
        # explicit pub get below since `flutter create` triggers its own
        # internal pub get — doing that first, then a single pub get
        # afterwards, avoids two back-to-back package downloads racing on
        # the same PUB_CACHE (a known source of flaky "file not found in
        # pub cache" build errors on GitHub-hosted Windows runners).
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            flutter config --enable-windows-desktop
            flutter create --platforms=windows .
          } else {
            Write-Host "windows/ already present, skipping scaffold."
          }

      - name: Flutter pub get
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pub get failed, retrying once..."
            Start-Sleep -Seconds 5
            flutter pub get
          }

      - name: Verify resolved packages actually exist on disk
        # Self-heal for the exact failure seen before: flutter_assemble's
        # kernel compile fails with "Error when reading .../lib/<pkg>.dart:
        # The system cannot find the file specified" even though pub get
        # exited 0 and package_config.json lists the package as resolved.
        # Read package_config.json, resolve every rootUri to a real path,
        # and if any is missing on disk, wipe just that cache entry and
        # re-run pub get so it's forced to re-fetch instead of trusting a
        # stale/incomplete cache entry.
        shell: pwsh
        run: |
          $configPath = ".dart_tool\package_config.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $missing = @()
          foreach ($pkg in $config.packages) {
            if ($pkg.rootUri -notlike "file://*") { continue }
            $path = [System.Uri]::new($pkg.rootUri).LocalPath
            if (-not (Test-Path $path)) {
              Write-Host "MISSING on disk: $($pkg.name) -> $path"
              $missing += $path
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "$($missing.Count) package(s) resolved but missing on disk. Clearing and re-fetching..."
            foreach ($p in $missing) {
              Remove-Item -Recurse -Force $p -ErrorAction SilentlyContinue
            }
            flutter pub get
          } else {
            Write-Host "All resolved packages verified present on disk."
          }

      - name: Extract app version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch 'version:\s*(\d+\.\d+\.\d+)(\+(\d+))?') {
            throw "Could not find a version: line in pubspec.yaml"
          }
          $appVersion = $Matches[1]
          $buildNumber = $Matches[3]
          Write-Host "App version: $appVersion (build $buildNumber)"
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "APP_VERSION=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ env.APP_VERSION }} `
            installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoomPOS-Windows-Installer-${{ env.APP_VERSION }}
          path: Output/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          generate_release_notes: true
