<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // Universal Directory & Subfolder Base Path Resolver
    (function () {
      var loc = window.location;
      var path = loc.pathname;
      var lastSeg = path.split('/').pop();
      if (path.length > 1 && !path.endsWith('/') && !lastSeg.includes('.')) {
        window.location.replace(loc.protocol + '//' + loc.host + path + '/' + loc.search + loc.hash);
        return;
      }
      if (!path.endsWith('/')) {
        path = path.substring(0, path.lastIndexOf('/') + 1);
      }
      var baseEl = document.querySelector('base');
      if (!baseEl) {
        baseEl = document.createElement('base');
        document.head.prepend(baseEl);
      }
      baseEl.setAttribute('href', path || '/');
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="ZooM-POS client — multi-tenant retail &amp; restaurant platform.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZooM-POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ZooM-POS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-track: rgba(59, 130, 246, 0.18);
      --primary-shadow: rgba(59, 130, 246, 0.35);
      --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-track: rgba(37, 99, 235, 0.14);
        --primary-shadow: rgba(37, 99, 235, 0.25);
        --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #app-loading-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      z-index: 999999;
      opacity: 1;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .loading-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 32px;
      border-radius: 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      max-width: 340px;
      width: 86%;
      text-align: center;
      animation: fadeInPanel 0.35s ease-out;
    }

    @keyframes fadeInPanel {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 6px 16px var(--primary-shadow);
      display: block;
      object-fit: contain;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .progress-bar-track {
      width: 100%;
      height: 4px;
      background: var(--primary-track);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 40%;
      background: var(--primary);
      border-radius: 999px;
      animation: indeterminate 1.5s infinite cubic-bezier(0.65, 0.815, 0.735, 0.395);
    }

    @keyframes indeterminate {
      0% {
        left: -40%;
        width: 40%;
      }
      50% {
        left: 20%;
        width: 60%;
      }
      100% {
        left: 100%;
        width: 40%;
      }
    }

    .status-text {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="app-loading-screen" role="status" aria-live="polite" aria-label="Loading ZooM-POS">
    <div class="loading-panel">
      <img
        class="brand-icon"
        id="loading-brand-icon"
        src="icons/Icon-192.png"
        alt="Logo"
        onerror="this.onerror=null; this.src='favicon.png'; this.onerror=function(){ this.style.display='none'; var fb=document.getElementById('brand-fallback-icon'); if(fb) fb.style.display='flex'; };"
      />
      <div id="brand-fallback-icon" style="display:none;width:68px;height:68px;border-radius:16px;background:var(--primary);color:#fff;font-size:26px;font-weight:800;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 6px 16px var(--primary-shadow);">
        POS
      </div>
      <h1 class="brand-title">ZooM-POS</h1>
      <p class="brand-subtitle">Smart Retail &amp; Restaurant POS</p>
      <div class="progress-bar-track">
        <div class="progress-bar-indicator"></div>
      </div>
      <div class="status-text">Loading application...</div>
    </div>
  </div>

  <script>
    (function () {
      var dismissed = false;
      var startTime = Date.now();
      var MIN_DISPLAY_TIME_MS = 2200; // Keep loading for at least 2.2s for a smooth, high-fidelity experience

      function dismissLoadingScreen() {
        if (dismissed) return;
        var elapsed = Date.now() - startTime;
        if (elapsed < MIN_DISPLAY_TIME_MS) {
          setTimeout(dismissLoadingScreen, MIN_DISPLAY_TIME_MS - elapsed);
          return;
        }
        dismissed = true;
        var screen = document.getElementById('app-loading-screen');
        if (!screen) return;
        screen.style.opacity = '0';
        screen.style.pointerEvents = 'none';
        setTimeout(function () {
          if (screen && screen.parentNode) {
            screen.parentNode.removeChild(screen);
          }
        }, 500);
      }

      // Global hooks for Flutter app readiness
      window.dismissFlutterSplash = dismissLoadingScreen;
      window.addEventListener('flutter-app-ready', dismissLoadingScreen);

      // Fallback: When Flutter paints first frame, allow up to 4s for auth/data hydration
      // before dismissing if flutter-app-ready was not triggered
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(dismissLoadingScreen, 4000);
      });

      // Progressive loading hints so users see dynamic feedback while Flutter engine & assets load
      var statusMessages = [
        { delay: 1800, text: 'Initializing POS Engine...' },
        { delay: 4000, text: 'Downloading application assets & cache...' },
        { delay: 7000, text: 'Setting up offline database & sync engine...' },
        { delay: 10000, text: 'Preparing terminal interface...' },
        { delay: 14000, text: 'Starting application...' }
      ];
      var statusEl = document.querySelector('.status-text');
      if (statusEl) {
        statusMessages.forEach(function (item) {
          setTimeout(function () {
            if (!dismissed && statusEl) {
              statusEl.textContent = item.text;
            }
          }, item.delay);
        });
      }

      // Safety timeout: dismiss after 30s only as a last-resort fallback
      setTimeout(dismissLoadingScreen, 30000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
